<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Zed Chemistry - Quiz Results</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4e225",
                        "background-light": "#f8f8f5",
                        "background-dark": "#222110",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .celebration-gradient {
            background: radial-gradient(circle at center, rgba(244, 226, 37, 0.2) 0%, transparent 70%);
        }

        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
    <!-- Top Navigation -->
    <nav
        class="flex items-center justify-between p-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-10">
        <a href="quiz.html"
            class="size-10 flex items-center justify-center rounded-full bg-background-light dark:bg-neutral-800 text-neutral-800 dark:text-white">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>
        <h1 class="text-lg font-bold text-neutral-800 dark:text-white">Quiz Results</h1>
        <button
            class="size-10 flex items-center justify-center rounded-full bg-background-light dark:bg-neutral-800 text-neutral-800 dark:text-white">
            <span class="material-symbols-outlined">share</span>
        </button>
    </nav>

    <main class="flex-1 flex flex-col px-6 pb-24">
        <!-- Hero Celebration Section -->
        <div class="relative py-8 flex flex-col items-center text-center overflow-hidden">
            <div class="absolute inset-0 celebration-gradient -z-10"></div>
            <!-- Mascot/Illustration -->
            <div class="relative mb-6">
                <div class="w-48 h-48 bg-primary/20 rounded-full flex items-center justify-center relative">
                    <div class="absolute -top-4 -right-2 bg-white dark:bg-neutral-700 p-2 rounded-full shadow-lg">
                        <span class="material-symbols-outlined text-primary text-3xl fill-1">workspace_premium</span>
                    </div>
                    <!-- Placeholder image, using the original one -->
                    <img class="w-40 h-40 object-contain"
                        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwR2SR_j6FXVQg8wByTJC3Uk9CMy04F8fTb_YciQZN0pde0hOdi8_4uFdvJtOw09VS9e1bVWTJo9iw30YbEOb7kKgeCEYsVsibh7e7Ua4-ZbTNTGMl5_00VYC0GII0cae13-S2LCPNkgjktlGLomAfMaj5u5e_nkYHiHQkfKYEQ46xtGbVw-6gZszSXFg3jt40d-CYeWdnoq-3VME0IBeX7lwd0gZGF9cDLIPZ1FJn3FKzjEksoAubmZ9zc5n0IjlL3Q_iUwyQBDQ" />
                </div>
            </div>
            <h2 class="text-3xl font-extrabold text-neutral-900 dark:text-white mb-2 leading-tight">You're a Chemistry
                Superstar!</h2>
            <p class="text-neutral-600 dark:text-neutral-400 font-medium mb-6">Great job! You mastered the basics.</p>

            <!-- Score Display -->
            <div class="bg-primary px-8 py-4 rounded-full shadow-[0_8px_0_0_#d4c310] mb-8">
                <span id="score-display" class="text-4xl font-black text-neutral-900">...</span>
            </div>
        </div>

        <!-- Performance Stats -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div
                class="bg-white dark:bg-neutral-800 p-4 rounded-xl shadow-sm border border-neutral-100 dark:border-neutral-700 flex flex-col items-center text-center">
                <div
                    class="size-12 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-500 flex items-center justify-center mb-2">
                    <span class="material-symbols-outlined">timer</span>
                </div>
                <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider">Time Taken</span>
                <span class="text-lg font-bold text-neutral-800 dark:text-white">00:45</span>
            </div>
            <div
                class="bg-white dark:bg-neutral-800 p-4 rounded-xl shadow-sm border border-neutral-100 dark:border-neutral-700 flex flex-col items-center text-center">
                <div
                    class="size-12 rounded-full bg-orange-100 dark:bg-orange-900/30 text-orange-500 flex items-center justify-center mb-2">
                    <span class="material-symbols-outlined">bolt</span>
                </div>
                <span class="text-xs font-bold text-neutral-400 uppercase tracking-wider">XP Earned</span>
                <span id="xp-gained-display" class="text-lg font-bold text-neutral-800 dark:text-white">+0 XP</span>
            </div>
        </div>

        <!-- Rewards Section -->
        <div class="bg-white dark:bg-neutral-800 p-6 rounded-xl shadow-sm border-2 border-primary/30 mb-8">
            <h3 class="text-center font-bold text-neutral-800 dark:text-white mb-4">Total XP</h3>
            <div class="flex justify-center items-center gap-2">
                <span class="material-symbols-outlined text-primary text-3xl">star</span>
                <span class="text-2xl font-black" data-gamify="xp">...</span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col gap-4">
            <a href="quiz.html"
                class="w-full bg-primary hover:bg-primary/90 text-neutral-900 font-extrabold py-5 rounded-full shadow-[0_6px_0_0_#d4c310] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">replay</span> Try Again
            </a>
            <a href="index.html"
                class="w-full bg-white dark:bg-neutral-800 border-4 border-neutral-100 dark:border-neutral-700 text-neutral-800 dark:text-white font-extrabold py-5 rounded-full transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-primary">home</span> Back to Home
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/gamification.js"></script>
    <script src="js/results.js"></script>
</body>

</html>
